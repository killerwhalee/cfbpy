[build-system]
requires = ["uv_build>=0.11.0,<0.12"]
build-backend = "uv_build"

[project]
name = "cfbpy"
version = "1.0.0"
authors = [
  { name="killerwhalee", email="killerwhalee@kaist.ac.kr" },
]
description = "Python module for compressing/decompressing compound file binary format (CFB)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

[dependency-groups]
# olefile is used only to cross-check files in tests
dev = ["pytest>=8", "olefile>=0.46"]

[project.urls]
Homepage = "https://github.com/killerwhalee/cfbpy"
Issues = "https://github.com/killerwhalee/cfbpy/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.build-backend]
# Package lives at the repository root instead of src/
module-root = ""
