[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cfbpy"
version = "0.0.3"
authors = [
  { name="killerwhalee", email="killerwhalee@kaist.ac.kr" },
]
description = "Python module for compressing/decompressing compound file binary format (CFB)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
# olefile is used only to cross-check files in tests
test = ["pytest", "olefile>=0.46"]

[project.urls]
Homepage = "https://github.com/killerwhalee/cfbpy"
Issues = "https://github.com/killerwhalee/cfbpy/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
